name: Consumer QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "apps/api/**"
      - "prisma/**"
      - "prisma/**"
      - "apps/mobile/**"
      - "packages/api-client/**"
      - "packages/i18n/**"
      - "packages/brand-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/consumer-qa.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "apps/api/**"
      - "apps/mobile/**"
      - "packages/api-client/**"
      - "packages/i18n/**"
      - "packages/brand-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/consumer-qa.yml"
jobs:
  consumer-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:17-master
        env:
          POSTGRES_DB: dauviet_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dauviet_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - name: Start isolated MinIO
        run: |
          docker run -d --name dauviet-ci-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data --console-address ":9001"
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && exit 0
            sleep 1
          done
          docker logs dauviet-ci-minio
          exit 1


      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma Client for API build
        run: pnpm db:generate
      - name: Clean PostGIS migration gate
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dauviet_ci?schema=public
      - name: Golden Dataset local preflight
        run: |
          pnpm db:seed
          pnpm db:preflight:production
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dauviet_ci?schema=public
      - name: Home V6 isolated media fixture gate
        run: pnpm --filter @dauviet/api seed:home-media:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dauviet_ci?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-32-characters-minimum-abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum-abcdef
          REDIS_URL: redis://127.0.0.1:6379
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: dauviet-media
          MEDIA_STORAGE_DRIVER: local-test
          MEDIA_TEST_STORAGE_ROOT: ${{ github.workspace }}/.test-media-storage
          MEDIA_TEST_STORAGE_BASE_URL: http://127.0.0.1:3002/v1/media/test-public

      - name: API production build gate
        run: pnpm --filter @dauviet/api build
      - name: Start local API for browser QA
        run: pnpm --filter @dauviet/api start:prod > /tmp/dauviet-api.log 2>&1 &
        env:
          NODE_ENV: test
          PORT: "3002"
          API_PREFIX: v1
          APP_URL: http://127.0.0.1:3001
          CORS_ORIGINS: http://127.0.0.1:3001
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dauviet_ci?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-32-characters-minimum-abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum-abcdef
          REDIS_URL: redis://127.0.0.1:6379
          SEARCH_PROJECTION_WORKER_ENABLED: "false"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_BUCKET: dauviet-media
          MEDIA_STORAGE_DRIVER: local-test
          MEDIA_TEST_STORAGE_ROOT: ${{ github.workspace }}/.test-media-storage
          MEDIA_TEST_STORAGE_BASE_URL: http://127.0.0.1:3002/v1/media/test-public
      - name: Wait for local API
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3002/v1/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dauviet-api.log
          exit 1
      - name: Web typecheck
        run: pnpm web:typecheck
      - name: Web build against local API
        run: pnpm web:build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3002
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3002/v1
          API_URL: http://127.0.0.1:3002
      - name: Start Web for browser QA
        run: pnpm --filter @dauviet/web start --hostname 127.0.0.1 --port 3001 > /tmp/dauviet-web.log 2>&1 &
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3002
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3002/v1
          API_URL: http://127.0.0.1:3002
      - name: Wait for Web
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:3001/map >/dev/null && exit 0; sleep 1; done
          cat /tmp/dauviet-web.log
          exit 1
      - name: Browser smoke QA
        run: |
          curl -fsS http://127.0.0.1:3001/ >/dev/null
          curl -fsS http://127.0.0.1:3001/map >/dev/null
      - name: Install Chromium for browser QA
        run: pnpm --filter @dauviet/web exec playwright install --with-deps chromium
      - name: Web browser QA
        run: pnpm --filter @dauviet/web exec playwright test
      - name: Web responsive viewport gate (375 / 768 / 1440)
        run: pnpm --filter @dauviet/web exec playwright test tests/responsive-gate.spec.ts
      - name: Home V6 visual evidence (390 / 1536)
        run: pnpm --filter @dauviet/web exec playwright test tests/home-v6-visual.spec.ts
      - name: Upload Home V5 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-v6-visual-${{ github.sha }}
          path: apps/web/qa-evidence/home-v6/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Map V4 visual evidence (390 / 1536)
        run: pnpm --filter @dauviet/web exec playwright test tests/map-v4-visual.spec.ts
      - name: Upload Map V4 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-v4-visual-${{ github.sha }}
          path: apps/web/qa-evidence/map-v4/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Web accessibility gate
        run: pnpm --filter @dauviet/web exec playwright test tests/accessibility.spec.ts
      - name: Web auth/session and ownership RBAC gate
        run: pnpm --filter @dauviet/web exec playwright test tests/auth-foundation.spec.ts tests/trip-together.spec.ts
      - name: Web failure retry and fail-closed gate
        run: pnpm --filter @dauviet/web exec playwright test tests/book-phase4.spec.ts tests/journey-detail-v3.spec.ts tests/phase5-community.spec.ts
      - run: pnpm --filter @dauviet/admin typecheck
      - run: pnpm --filter @dauviet/admin build
      - name: Start Admin for browser RBAC QA
        run: pnpm --filter @dauviet/admin start --hostname 127.0.0.1 --port 3003 > /tmp/dauviet-admin.log 2>&1 &
      - name: Wait for Admin
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:3003/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/dauviet-admin.log
          exit 1
      - name: Admin browser RBAC QA
        run: pnpm --filter @dauviet/web exec playwright test --config ../admin/playwright.config.ts
      - name: Admin responsive viewport gate (375 / 768 / 1440)
        run: pnpm --filter @dauviet/web exec playwright test --config ../admin/playwright.config.ts ../admin/tests/responsive.spec.ts
      - name: Admin accessibility gate
        run: pnpm --filter @dauviet/web exec playwright test --config ../admin/playwright.config.ts ../admin/tests/accessibility.spec.ts
      - name: Admin explicit RBAC boundary gate
        run: pnpm --filter @dauviet/web exec playwright test --config ../admin/playwright.config.ts ../admin/tests/rbac.spec.ts
      - run: pnpm --filter @dauviet/mobile typecheck
      - name: Mobile native layout regression gate
        run: pnpm --filter @dauviet/mobile exec tsx src/qa/layout-regression.ts
        env:
          DAUViet_MOBILE_LAYOUT_QA: "1"
      - name: Mobile accessibility regression gate
        run: pnpm --filter @dauviet/mobile exec tsx src/qa/accessibility-regression.ts
        env:
          DAUViet_MOBILE_ACCESSIBILITY_QA: "1"
      - name: Mobile auth/session fail-closed gate
        run: pnpm --filter @dauviet/mobile exec tsx src/qa/auth-session-regression.ts
        env:
          DAUViet_MOBILE_AUTH_QA: "1"
      - name: Mobile failure/offline and fail-closed gate
        run: pnpm --filter @dauviet/mobile exec tsx src/qa/failure-offline-regression.ts
        env:
          DAUViet_MOBILE_FAILURE_QA: "1"
      - name: Mobile Phase 7 regression QA
        run: pnpm --filter @dauviet/mobile exec tsx src/qa/phase7-regression.ts
        env:
          DAUViet_PHASE7_QA: "1"
